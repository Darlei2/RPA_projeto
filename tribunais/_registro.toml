# Registro unico dos tribunais: a IDENTIDADE de cada tribunal (fonte da verdade).
#
# id                identificador interno e permanente; e o nome do arquivo tribunais\<id>.toml e e por
#                   ele que pedidos, integracoes, historico e regras reconhecem o tribunal. Nunca mude.
# nome              nome de exibicao (o mesmo do campo `tribunal` do .toml).
# ramo / sigla      TRT, TJ, TRF, TRE, TSE, TST, CNJ / TRT5, TJES, TREMG...
# grau              "1G", "2G" ou "" (instancia unica).
# grupo_credencial  tribunais que compartilham UMA credencial (os dois graus de cada TRT); "" = independente.
# endereco_padrao   endereco de login de referencia (o do .toml no Git); usado so para reconhecer registros
#                   antigos que guardavam o endereco no lugar da identidade.
# hosts_autorizados hosts em que a navegacao pode comecar (validacao de enderecos, independente da identidade).
#                   Se o tribunal mudar de endereco oficial, mude o base_url no .toml e, se o host mudar,
#                   acrescente o novo aqui. Nenhum codigo, pedido ou credencial precisa mudar.

