# Configuracao comum a todos os tribunais do PJe.
# Nao rode este arquivo direto: use tribunais\<nome>.toml, que herda daqui.
[app]
environment = "production"   # necessario para o ensaio; o envio real segue bloqueado abaixo
tribunal = "DEFINIR_NO_ARQUIVO_DO_TRIBUNAL"
base_url = "https://pje.jus.br/definir-no-arquivo-do-tribunal"
selectors_approved = false
allow_live_submission = false
# Referencia do documento em que o advogado autoriza o uso do A1 (contrato, termo etc.)
require_authorization_ref = true

[browser]
engine = "chromium"
channel = "msedge"
headless = false
timeout_ms = 30000

# Formatos aceitos: css=..., label=..., text=..., role=button|name=..., url=trecho-da-url
# Base comum a todos os tribunais. Cada tribunais\<nome>.toml faz `herda = "_comum.toml"`
# e sobrescreve so o que for diferente naquele PJe (normalmente nada alem de [app]).
[selectors]
# Campos do formulario fixados por tribunal (quando a heuristica nao decide sozinha), no .toml
# do tribunal: campo_uf = ["id=formEndereco:uf"] | ["name=..."] | ["label=trecho do rotulo"].
# Chaves: campo_cep, campo_logradouro, campo_address_number, campo_complemento, campo_bairro,
# campo_cidade, campo_uf, campo_email, campo_ddd, campo_phone.
# Login: TJs/TRFs costumam redirecionar direto para o SSO (input#kc-pje-office);
# a Justica do Trabalho mostra antes "Entrar com PDPJ" (clicado so se aparecer).
login_sso_button = ["role=button|name=Entrar com PDPJ", "text=Entrar com PDPJ"]
login_certificate_button = ["css=#kc-pje-office", "css=.certificado a", "role=button|name=CERTIFICADO DIGITAL", "text=Seu certificado digital"]
registration_form = ["text=Confirmar dados e prosseguir"]
detected_name = ["label=Nome", "css=input[name*='nome']"]
detected_cpf = ["label=CPF", "css=input[name*='cpf']"]
detected_oab = ["label=Inscricao OAB", "css=input[name*='oab']"]
email = ["label=Endereco de e-mail", "label=E-mail"]
phone = ["label=Telefone", "label=Celular"]
cep = ["label=CEP"]
logradouro = ["label=Logradouro", "label=Endereco"]
address_number = ["label=Numero"]
complemento = ["label=Complemento"]
bairro = ["label=Bairro"]
cidade = ["label=Cidade", "label=Municipio"]
uf = ["label=UF", "label=Estado"]
confirm_data = ["role=button|name=Confirmar dados e prosseguir", "text=Confirmar dados e prosseguir"]
commitment_term = ["text=Termo de compromisso", "text=informacoes sobre o uso do sistema"]
sign_term = ["role=button|name=Assinar termo de compromisso", "text=Assinar termo de compromisso"]
completion = ["text=Cadastro concluído com sucesso", "text=Cadastro concluido com sucesso", "text=cadastro foi concluído", "text=cadastro foi concluido", "text=cadastro concluido", "url=cadastroConcluido"]
lawyer_panel = ["text=Painel do advogado", "text=Painel do usuario", "url=QuadroAviso", "url=/Painel/", "url=painel_usuario", "text=Quadro de avisos"]
second_factor = ["css=input#otp", "css=input[name='otp']", "css=input[autocomplete='one-time-code']", "text=dois fatores", "text=segundo fator", "text=código de verificação", "text=codigo de verificacao", "text=código de autenticação", "text=codigo de autenticacao"]
second_factor_input = ["css=input#otp", "css=input[name='otp']", "css=input[autocomplete='one-time-code']", "label=Código", "label=Codigo", "css=input[name*='codigo']", "css=input[name*='code']"]
second_factor_submit = ["css=#kc-login", "role=button|name=Validar", "role=button|name=Confirmar", "role=button|name=Enviar", "role=button|name=Entrar"]

[stop_markers]
captcha = ["captcha", "nao sou um robo", "recaptcha", "confirm you are human", "confirme que voce e humano"]
certificate_error = ["certificado invalido", "certificado expirado", "certificado revogado", "erro no certificado"]
access_blocked = ["acesso bloqueado", "acesso negado", "usuario bloqueado", "forbidden"]
jus_postulandi = ["jus postulandi", "juspostulandi"]


# Janela "Selecao de certificado" do PJeOffice PRO (Java), operada pelo Java Access Bridge.
# Ligue o bridge uma vez e reinicie o PJeOffice:
#   & "C:\Program Files\PJeOffice Pro\jre\bin\jabswitch.exe" -enable
# Para inspecionar a janela aberta: python -m pje_rpa inspect-signer
[signer]
window_title_regex = '(?i)sele\w+o de certificado'
appear_timeout_s = 90   # o PJeOffice leva ~25 s lendo os certificados do Windows
max_dialogs = 4
jab_dll = 'C:\Program Files\PJeOffice Pro\jre\bin\WindowsAccessBridge-64.dll'
store_option = "Windows"
ok_button = "OK"
